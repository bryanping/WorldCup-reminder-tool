<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffffff">
<script async src="https://www.googletagmanager.com/gtag/js?id=G-1Z3FMHJKJ3"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-1Z3FMHJKJ3');</script>
<title>行程確認 · Secalender</title>
<meta name="description" content="查看別人分享給你的時間安排，確認後可直接加入自己的行事曆。">
<meta name="robots" content="noindex">
<meta property="og:title" content="Secalender 行程">
<meta property="og:description" content="有人分享了一份時間安排給你。">
<meta property="og:image" content="https://secalender.com/assets/og.png">
<link rel="stylesheet" href="/assets/ui.css">
<style>
.badge{display:inline-block;font-size:.74rem;color:var(--ac-tx);background:rgba(0,113,227,.1);
  border-radius:999px;padding:4px 12px;margin-bottom:12px}
.by{color:var(--tx2);font-size:.9rem;margin-top:6px}
.state{color:var(--tx2);text-align:center;padding:60px 0;font-size:.95rem}
.untimed .t{color:var(--tx3)}
</style>
</head>
<body>

<nav class="nav">
 <div class="in">
  <a class="brand" href="/">Secalender</a>
  <a href="/#intro">介紹</a>
  <a href="/#templates">模板</a>
  <a href="/calendar.html">日曆</a>
  <a href="/support.html">聯繫我們</a>
  <span class="sp"></span>
  <a class="btn" href="https://testflight.apple.com/join/K3JKca9n">取得 App</a>
 </div>
</nav>

<section class="band tight">
 <div class="in narrow">
  <div id="head" class="center"></div>
  <div id="addwrap" hidden>
   <div class="addbox">
    <h3>加入你的行事曆</h3>
    <p>下載 .ics 直接加入 iPhone、Google 或 Outlook；已安裝 App 可直接在 App 中開啟並確認。</p>
    <div class="actions">
     <button class="btn" id="btnIcs" type="button">下載並加入行事曆</button>
     <button class="btn quiet" id="btnApp" type="button">在 App 開啟</button>
    </div>
    <p class="hint">共 <b id="cnt">0</b> 個行程</p>
   </div>
  </div>
  <div class="timeline" id="app"><div class="state">載入中…</div></div>
 </div>
</section>

<div class="foot">
 <div class="in">
  <div class="row"><a href="/">介紹</a><a href="/#templates">模板</a><a href="/calendar.html">日曆</a><a href="/support.html">聯繫我們</a><a href="/privacy.html">隱私政策</a><a href="/terms.html">服務條款</a></div>
  <div>© 上海活動曆創意服務有限公司 · <a href="https://huodonli.com">huodonli.com</a></div>
 </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="/assets/fb.js"></script>
<script src="/assets/ics.js"></script>
<script src="/assets/ui.js"></script>
<script>
(function(){
  var app=document.getElementById('app'), head=document.getElementById('head');
  function esc(s){var d=document.createElement('div');d.textContent=s==null?'':s;return d.innerHTML}
  function fail(msg){app.innerHTML='<div class="state">'+msg+'</div>'}
  if(typeof firebase==='undefined'){fail('連線失敗，請檢查網路後重新整理。');return}
  firebase.initializeApp(window.FB_CONFIG);
  var db=firebase.firestore();
  var id=new URLSearchParams(location.search).get('id');
  if(!id){fail('連結無效：缺少安排編號');return}

  var fmtDay=function(d){return d.toLocaleDateString('zh-TW',{month:'long',day:'numeric',weekday:'short'})},
      fmtT=function(d){return d.toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit',hour12:false})};

  db.collection('shared_plans').doc(id).get().then(function(doc){
    if(!doc.exists){fail('找不到這份安排，可能已被移除');return}
    render(doc.data());
  }).catch(function(e){console.error(e);fail('載入失敗，請稍後再試')});

  function render(data){
    var title=data.title||'時間安排';
    document.title=title+' · Secalender';
    head.innerHTML='<div class="badge">待成員確認</div>'+
      '<h1 class="display" style="font-size:2rem">'+esc(title)+'</h1>'+
      (data.creatorName?'<p class="by">由 '+esc(data.creatorName)+' 發起</p>':'');

    var items=data.items||[],
        timed=items.filter(function(i){return i.startAt}).sort(function(a,b){return a.startAt.seconds-b.startAt.seconds}),
        untimed=items.filter(function(i){return !i.startAt}),
        html='', last='', list=[];

    timed.forEach(function(it){
      var s=it.startAt.toDate(), e=it.endAt?it.endAt.toDate():new Date(s.getTime()+(it.durationMin||60)*60000),
          day=fmtDay(s);
      list.push({start:s,end:e,title:it.title||'',loc:it.location||'',note:it.notes||''});
      if(day!==last){html+='<div class="daybar">'+day+'</div>';last=day}
      html+='<div class="item"><div class="t">'+fmtT(s)+'<small>'+fmtT(e)+'</small></div><div>'+
        '<h4>'+esc(it.title)+'</h4>'+
        (it.location?'<div class="loc">'+esc(it.location)+'</div>':'')+
        (it.notes?'<div class="note">'+esc(it.notes)+'</div>':'')+
        '</div></div>';
    });
    if(untimed.length){
      html+='<div class="daybar">待安排</div>';
      untimed.forEach(function(it){
        html+='<div class="item untimed"><div class="t">'+(it.durationMin?'約 '+it.durationMin+' 分':'—')+'</div>'+
          '<div><h4>'+esc(it.title)+'</h4></div></div>';
      });
    }
    app.innerHTML=html||'<div class="state">這份安排沒有內容</div>';

    if(list.length){
      document.getElementById('addwrap').hidden=false;
      document.getElementById('cnt').textContent=list.length;
      document.getElementById('btnIcs').addEventListener('click',function(){
        var n=window.ICS.downloadEvents(title,list,'secalender-plan.ics');
        toast('已下載 '+n+' 個行程，開啟檔案即可加入行事曆');
      });
      document.getElementById('btnApp').addEventListener('click',function(){
        location.href='secalender://plan/'+encodeURIComponent(id);
        setTimeout(function(){toast('若沒有反應，表示尚未安裝 App')},1200);
      });
    }
  }
})();
</script>
</body>
</html>
