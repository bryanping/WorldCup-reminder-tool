<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Secalender 邀請</title>
<meta name="robots" content="noindex">
<meta property="og:title" content="Secalender 邀請">
<meta property="og:description" content="你收到一個 Secalender 行程／好友邀請，點開即可查看。">
<meta property="og:image" content="https://secalender.com/assets/og.png">
<style>
:root{--bg:#0b1220;--card:#131c30;--card2:#1a2742;--tx:#e8eefc;--mut:#8fa3c8;--ac:#4f8cff;--ac2:#22c55e;--bd:#243352}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans TC",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:32px 24px;max-width:420px;width:100%;text-align:center}
.ic{font-size:56px;margin-bottom:12px}
h1{font-size:22px;margin-bottom:8px}
p{color:var(--mut);font-size:15px;line-height:1.6}
.btn{display:block;margin-top:20px;padding:14px;border-radius:12px;font-size:16px;font-weight:600;text-decoration:none;color:#fff;background:var(--ac)}
.btn.sec{background:var(--card2);color:var(--tx);margin-top:10px;font-weight:500}
.foot{margin-top:24px;font-size:12px;color:var(--mut)}
.foot a{color:var(--ac);text-decoration:none}
.hide{display:none}
</style>
</head>
<body>
<div class="card">
  <div class="ic" id="ic">📅</div>
  <h1 id="h1">你收到一個邀請</h1>
  <p id="p">在 Secalender App 中開啟以查看完整內容並加入。</p>
  <a class="btn" id="open" href="#">開啟 Secalender App</a>
  <a class="btn sec" href="https://testflight.apple.com/join/K3JKca9n">尚未安裝？加入 iOS 公測</a>
  <a class="btn sec" href="/">前往 Secalender 官網</a>
  <div class="foot">由 <a href="https://secalender.com">Secalender</a> 提供 · 邀請連結 30 天內有效<br><a href="/support.html">支援</a> · <a href="/privacy.html">隱私</a> · <a href="/terms.html">條款</a></div>
</div>
<script>
(function(){
  // 解析 /invite/{code}、/friend/{code}、/event/{id}?creatorId=、/group/{groupId}
  var parts=location.pathname.split('/').filter(Boolean);
  var kind=parts[0]||'', code=parts[1]||'';
  var deep='';
  if(kind==='invite'&&code){deep='secalender://invite/'+encodeURIComponent(code);}
  else if(kind==='friend'&&code){deep='secalender://friend/'+encodeURIComponent(code);
    document.getElementById('ic').textContent='👋';
    document.getElementById('h1').textContent='有人邀請你成為好友';
    document.getElementById('p').textContent='在 Secalender App 中開啟以添加好友。';}
  else if(kind==='event'&&code){deep='secalender://event/'+encodeURIComponent(code)+location.search;}
  else if(kind==='group'&&code){deep='secalender://group/'+encodeURIComponent(code);
    document.getElementById('ic').textContent='👥';
    document.getElementById('h1').textContent='有人邀請你加入社群';
    document.getElementById('p').textContent='在 Secalender App 中開啟即可加入。';}
  else{
    document.getElementById('ic').textContent='🔍';
    document.getElementById('h1').textContent='找不到頁面';
    document.getElementById('p').textContent='這個連結可能已失效或輸入錯誤。';
    document.getElementById('open').classList.add('hide');
    return;
  }
  var btn=document.getElementById('open');
  btn.href=deep;
  // iOS/Android 自動嘗試開 App；未安裝則停留本頁
  var ua=navigator.userAgent||'';
  if(/iPhone|iPad|iPod|Android/i.test(ua)){
    setTimeout(function(){location.href=deep;},300);
  }
})();
</script>
</body>
</html>
