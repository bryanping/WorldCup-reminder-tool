<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Secalender 邀請</title>
<meta name="robots" content="noindex">
<meta property="og:title" content="Secalender 邀請">
<meta property="og:description" content="你收到一個 Secalender 行程／好友邀請，點開即可查看。">
<meta property="og:image" content="https://secalender.com/assets/og.png">
<link rel="stylesheet" href="/assets/ui.css">
<style>
body{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;background:var(--bg2)}
.card{background:#fff;border-radius:var(--r-l);box-shadow:var(--sh);padding:44px 34px;max-width:420px;width:100%;text-align:center}
.card .ic{font-size:44px;display:block;margin-bottom:14px}
.card h1{font-size:1.5rem;font-weight:600;letter-spacing:-.02em;margin-bottom:8px}
.card p{color:var(--tx2);font-size:.95rem;line-height:1.6;margin-bottom:26px}
.card .btn{width:100%;margin-bottom:10px}
.foot-mini{font-size:.76rem;color:var(--tx3);margin-top:18px;line-height:1.8}
.hide{display:none}
</style>
</head>
<body>
<div class="card">
  <span class="ic" id="ic">📅</span>
  <h1 id="h1">你收到一個邀請</h1>
  <p id="p">在 Secalender App 中開啟以查看完整內容並加入。</p>
  <a class="btn" id="open" href="#">開啟 Secalender App</a>
  <a class="btn quiet" href="https://testflight.apple.com/join/K3JKca9n">尚未安裝？加入 iOS 公測</a>
  <a class="btn quiet" href="/">前往 Secalender 官網</a>
  <div class="foot-mini">邀請連結 30 天內有效<br>
   <a href="/support.html">聯繫我們</a> · <a href="/privacy.html">隱私政策</a> · <a href="/terms.html">服務條款</a></div>
</div>
<script>
(function(){
  // 解析 /invite/{code}、/friend/{code}、/event/{id}?creatorId=、/group/{groupId}
  var parts=location.pathname.split('/').filter(Boolean);
  var kind=parts[0]||'', code=parts[1]||'';
  var deep='';
  if(kind==='invite'&&code){deep='secalender://invite/'+encodeURIComponent(code);}
  else if(kind==='friend'&&code){deep='secalender://friend/'+encodeURIComponent(code);
    document.getElementById('ic').textContent='👋';
    document.getElementById('h1').textContent='有人邀請你成為好友';
    document.getElementById('p').textContent='在 Secalender App 中開啟以添加好友。';}
  else if(kind==='event'&&code){deep='secalender://event/'+encodeURIComponent(code)+location.search;}
  else if(kind==='group'&&code){deep='secalender://group/'+encodeURIComponent(code);
    document.getElementById('ic').textContent='👥';
    document.getElementById('h1').textContent='有人邀請你加入社群';
    document.getElementById('p').textContent='在 Secalender App 中開啟即可加入。';}
  else{
    document.getElementById('ic').textContent='🔍';
    document.getElementById('h1').textContent='找不到頁面';
    document.getElementById('p').textContent='這個連結可能已失效或輸入錯誤。';
    document.getElementById('open').classList.add('hide');
    return;
  }
  var btn=document.getElementById('open');
  btn.href=deep;
  // iOS/Android 自動嘗試開 App；未安裝則停留本頁
  var ua=navigator.userAgent||'';
  if(/iPhone|iPad|iPod|Android/i.test(ua)){
    setTimeout(function(){location.href=deep;},300);
  }
})();
</script>
</body>
</html>
