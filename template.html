<meta name="description" content="檢視完整行程時間軸，選一個開始日期，一鍵加入你的行事曆。">
<meta property="og:title" content="行程模板 · Secalender">

<body id="tplDetail">

<nav class="nav">
 <div class="in">
  <a class="brand" href="/">Secalender</a>
  <a href="/#intro">介紹</a>
  <a href="/#templates">模板</a>
  <a href="/calendar.html">日曆</a>
  <a href="/support.html">聯繫我們</a>
  <span class="sp"></span>
  <a class="btn" href="https://testflight.apple.com/join/K3JKca9n">取得 App</a>
 </div>
</nav>

<section class="band tight">
 <div class="in narrow center" id="tplHead"></div>

 <div class="in narrow">
  <div class="addbox">
   <h3>加入你的行事曆</h3>
   <p>選一個開始日期，整份行程會依相對時間排好；下載的 .ics 可直接加入 iPhone、Google 或 Outlook 行事曆。</p>
   <div class="field">
    <label for="startDate">開始日期</label>
    <input type="date" id="startDate">
    <span id="weekWrap" hidden>
     <label for="weeks">重複</label>
     <select id="weeks" style="font-family:inherit;font-size:1rem;padding:9px 13px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--tx)">
      <option value="1">1 週</option><option value="2">2 週</option>
      <option value="4" selected>4 週</option><option value="8">8 週</option><option value="12">12 週</option>
     </select>
    </span>
   </div>
   <div class="actions">
    <button class="btn" id="btnIcs" type="button">下載並加入行事曆</button>
    <button class="btn quiet" id="btnApp" type="button">在 App 開啟</button>
    <button class="btn quiet" id="btnCopy" type="button">複製行程</button>
   </div>
   <p class="hint">共 <b id="cnt">0</b> 個行程 · iPhone 點開 .ics 後選擇要加入的行事曆；Android 可匯入 Google 日曆。</p>
  </div>
 </div>
</section>

<section class="band alt tight">
 <div class="in narrow">
  <h2 class="title" data-in>行程內容</h2>
  <div class="timeline" id="tplTimeline"></div>
 </div>
</section>

<section class="band tight">
 <div class="in">
  <h2 class="title center" data-in>其他模板</h2>
 </div>
 <div class="rail" id="moreRail" style="margin-top:28px"></div>
</section>
